<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicação de Autenticação</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 15px; padding: 10px; border-radius: 4px; display: block; text-align: center; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <h2>Aplicação de Utilizador</h2>
    <div id="message"></div>

    <div id="register-section">
        <h3>--- REGISTO DE UTILIZADOR ---</h3>
        <p>Seja bem-vindo(a)!</p>
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="reg-username">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="reg-password">
        </div>
        <button onclick="registarUtilizador()">Registar</button>
    </div>

    <div id="login-section" style="display: none;">
        <h3>--- LOGIN ---</h3>
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="login-username">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="login-password">
        </div>
        <button onclick="efetuarLogin()">Entrar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
